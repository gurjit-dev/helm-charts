grafana:
  ingress:
    enabled: true
    ingressClassName: nginx
    hosts:
      - grafana.lab.local
    tls:
      - secretName: grafana-tls
        hosts:
          - grafana.lab.local

prometheus:
  prometheusSpec:
    retention: 15d
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: local-path
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

alertmanager:
  enabled: false

grafana:
  adminPassword: changeme


